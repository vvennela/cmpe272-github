name: cmpe272-jenkins
services:
  jenkins:
    build: ./jenkins
    restart: unless-stopped
    ports:
      - "127.0.0.1:8080:8080"
    environment:
      JAVA_OPTS: -Djenkins.install.runSetupWizard=false
    volumes:
      - jenkins_home:/var/jenkins_home
      - ./.secrets:/run/jenkins-secrets:ro
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:8080/login"]
      interval: 10s
      timeout: 5s
      retries: 30
  webhook:
    image: nginx:stable-alpine
    restart: unless-stopped
    depends_on:
      jenkins:
        condition: service_healthy
    ports:
      - "127.0.0.1:8081:80"
    volumes:
      - ./jenkins/webhook.conf:/etc/nginx/conf.d/default.conf:ro
  tunnel:
    image: cloudflare/cloudflared:latest
    restart: unless-stopped
    depends_on:
      - webhook
    command: tunnel --no-autoupdate --url http://webhook:80
volumes:
  jenkins_home:
