server {
    listen 80;
    client_max_body_size 25m;
    location = /github-webhook/ {
        limit_except POST { deny all; }
        proxy_pass http://jenkins:8080/github-webhook/;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto https;
    }
    location / { return 404; }
}
